<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Book Gallery</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ec;color:#2c2926;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}.wrap{max-width:1250px;margin:auto;padding:30px 22px 60px}.hero{padding:20px 2px 28px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#877b6b}.hero h1{font-family:Georgia,serif;font-weight:500;font-size:42px;margin:8px 0}.hero p{color:#766d62;margin:0}.tools{display:flex;gap:10px;margin:14px 0 22px}.tools input{border:1px solid #ddd3c7;border-radius:12px;padding:12px 14px;background:white;flex:1;font-size:15px}.count{padding:10px;color:#756b60;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}.card{background:#fff;border-radius:15px;overflow:hidden;border:1px solid #e8e1d8;box-shadow:0 3px 12px #382b1a0b;cursor:pointer;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px #382b1a13}.cover{height:285px;margin:14px 14px 0;border-radius:9px;background:linear-gradient(145deg,#d9cfc1,#b9aa96);display:flex;justify-content:center;align-items:center;text-align:center;padding:16px;color:#fff;position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:contain;display:none;background:#f4f0ea}.cover.loaded img{display:block}.cover.loaded .fallback{display:none}.fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;position:relative}.mark{font-size:11px;letter-spacing:.24em;opacity:.85}.cover-title{font-family:Georgia,serif;font-size:20px;line-height:1.2;font-weight:600;max-width:95%;margin:18px 0;text-shadow:0 1px 4px #0002}.cover-author{font-size:13px}.cover-note{position:absolute;bottom:12px;font-size:10px;opacity:.65;letter-spacing:.1em}.info{padding:15px 17px 18px}.info h3{font-family:Georgia,serif;font-size:17px;line-height:1.35;margin:0 0 7px}.ko{font-size:13px;color:#766b60;margin:0 0 8px}.author{font-size:13px;margin:0;color:#62584e}.publisher{font-size:12px;margin:6px 0;color:#94887b}.ko-link{display:inline-flex;margin-top:8px;padding:7px 10px;border-radius:20px;background:#e9f1e8;color:#355b3a;text-decoration:none;font-size:11px;font-weight:650}.ko-link:hover{background:#dce9db}.empty{padding:50px;text-align:center;color:#7b7166;display:none}.hint{font-size:12px;color:#877b6b;margin-top:8px}.modal{position:fixed;inset:0;background:#211c18cc;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modalbox{background:#fbfaf7;border-radius:16px;max-width:850px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(230px,360px) 1fr;gap:22px;padding:22px;position:relative}.modalcover{min-height:300px;background:#eee5da;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}.modalcover img{max-width:100%;max-height:72vh;object-fit:contain;display:none}.modalcover img.show{display:block}.modalcover .modalfallback{padding:25px;text-align:center;color:#776654}.modalinfo{padding:12px 4px}.modalinfo h2{font:500 25px Georgia,serif;line-height:1.3;margin:0 0 10px}.modalinfo p{margin:8px 0;color:#62584e}.modalclose{position:absolute;right:12px;top:12px;border:0;background:#eee6dc;border-radius:50%;width:36px;height:36px;font-size:22px;cursor:pointer}.source{display:inline-block;margin-top:12px;color:#66594a;font-size:13px}.modalbuy{display:inline-flex;margin-top:15px;padding:9px 12px;background:#e9f1e8;color:#355b3a;border-radius:22px;text-decoration:none;font-weight:650;font-size:13px}.note{font-size:12px;color:#938777;margin-top:12px}@media(max-width:650px){.modalbox{grid-template-columns:1fr}.modalcover{min-height:250px}.modalinfo{padding-top:0}.hero h1{font-size:34px}}
</style></head><body><div class="wrap"><header class="hero"><div class="eyebrow">PERSONAL READING COLLECTION</div><h1>My Book Gallery</h1><p>표지 사진 · 한국어판 링크 · 책 정보를 카드로 모아 보는 라이브러리</p><div class="hint">카드에는 표지 사진이 표시됩니다. 카드를 누르면 별도 출처 이미지(표지와 구분), 출처 페이지, 관련 기사 링크를 확인합니다.</div></header><div class="tools"><input id="search" placeholder="책 제목, 저자, 한국어 제목 검색…"><div class="count" id="count">69 books</div></div><section class="grid" id="grid"></section><div class="empty" id="empty">검색 결과가 없어요.</div></div><div class="modal" id="modal" aria-modal="true" role="dialog"><div class="modalbox"><button class="modalclose" id="close" aria-label="닫기">×</button><div class="modalcover"><img id="modalimg" alt="책 관련 출처 이미지 (표지 이미지와 별도)"><div class="modalfallback" id="modalfallback">이 책의 별도 출처 이미지는 아직 등록되지 않았어요.<br>카드 표지는 팝업에 사용하지 않습니다.</div></div><div class="modalinfo" id="modalinfo"></div></div></div><script>
const books=[{"title":"A Hologram for the King","ko":"왕을 위한 홀로그램","author":"Dave Eggers","publisher":"McSweeney's"},{"title":"A Little Life","ko":"리틀 라이프","author":"Hanya Yanagihara","publisher":"Doubleday"},{"title":"All You Can Ever Know: A Memoir","ko":"내가 알게 된 모든 것","author":"Nicole Chung","publisher":"Catapult"},{"title":"Atomic Habits","ko":"아주 작은 습관의 힘","author":"James Clear","publisher":"Avery"},{"title":"Black Wave","ko":"","author":"Michelle Tea","publisher":"Feminist Press"},{"title":"Children of the New World","ko":"","author":"Alexander Weinstein","publisher":"Picador"},{"title":"Crying in H Mart","ko":"H마트에서 울다","author":"Michelle Zauner","publisher":"Alfred A. Knopf","sourceImage":null,"sourceUrl":null},{"title":"Divergent","ko":"다이버전트","author":"Veronica Roth","publisher":"Katherine Tegen Books (HarperCollins)"},{"title":"Emperor of Gladness","ko":"기쁨의 황제","author":"Ocean Vuong","publisher":"Penguin Press"},{"title":"Every Good Endeavor: Connecting Your Work to God's Plan for the World","ko":"팀 켈러의 일과 영성","author":"Timothy Keller","publisher":"Dutton"},{"title":"Everything I Never Told You","ko":"내가 너에게 절대로 말하지 않는 것들","author":"Celeste Ng","publisher":"Penguin Press"},{"title":"Exhalation","ko":"숨","author":"Ted Chiang","publisher":"Alfred A. Knopf"},{"title":"Faculty Department Vol. 2","ko":"","author":"Justin Chung","publisher":"Faculty Department (Studio Faculty)"},{"title":"Getting Back Out There: Secrets to Successful Dating and Finding Real Love after the Big Breakup","ko":"","author":"Susan J. Elliott","publisher":"Da Capo Lifelong Books (Hachette)"},{"title":"Goodbye, Again","ko":"하던 일을 멈추고 바닷속으로","author":"Jonny Sun","publisher":"확인 필요"},{"title":"Holding the Man","ko":"","author":"Timothy Conigrave","publisher":"Penguin Books Australia"},{"title":"If I Had Your Face","ko":"너의 얼굴을 갖고 싶어","author":"Frances Cha","publisher":"Ballantine Books"},{"title":"In the Distance","ko":"먼 곳에서","author":"Hernán Díaz","publisher":"Coffee House Press"},{"title":"Interior Chinatown","ko":"","author":"Charles Yu","publisher":"Pantheon"},{"title":"Just Kids","ko":"저스트 키즈","author":"Patti Smith","publisher":"Ecco (HarperCollins)"},{"title":"Kindred","ko":"킨","author":"Octavia E. Butler","publisher":"Beacon Press"},{"title":"Kitchen Confidential: Adventures in the Culinary Underbelly","ko":"","author":"Anthony Bourdain","publisher":"Bloomsbury USA"},{"title":"Life After Life","ko":"라이프 애프터 라이프","author":"Kate Atkinson","publisher":"Little, Brown and Company (Reagan Arthur Books)"},{"title":"Life of M","ko":"","author":"Rachel Cusk","publisher":"Faber & Faber"},{"title":"Magic for Liars","ko":"","author":"Sarah Gailey","publisher":"Tor Books"},{"title":"Malibu Rising","ko":"말리부의 사랑법","author":"Taylor Jenkins Reid","publisher":"Ballantine Books"},{"title":"Meditations","ko":"명상록","author":"Marcus Aurelius","publisher":"(판본마다 다름)"},{"title":"Modern Romance","ko":"모던 로맨스: SNS 시대의 낭만적 사랑과 사회","author":"Aziz Ansari (with Eric Klinenberg)","publisher":"Penguin Press"},{"title":"Moonwalking with Einstein: The Art and Science of Remembering Everything","ko":"1년 만에 기억력 천재가 된 남자","author":"Joshua Foer","publisher":"Penguin Press"},{"title":"Mortality","ko":"신 없이 어떻게 죽을 것인가","author":"Christopher Hitchens","publisher":"Twelve (Hachette)"},{"title":"Mr. Penumbra's 24-Hour Bookstore","ko":"페넘브라의 24시 서점","author":"Robin Sloan","publisher":"Farrar, Straus and Giroux"},{"title":"My Ex-Life","ko":"","author":"Stephen McCauley","publisher":"Flatiron Books"},{"title":"Number One Chinese Restaurant","ko":"","author":"Lillian Li","publisher":"Henry Holt and Company"},{"title":"On Earth We're Briefly Gorgeous","ko":"지상에서 우리는 잠시 매혹적이다","author":"Ocean Vuong","publisher":"Penguin Press"},{"title":"On Such a Full Sea","ko":"만조의 바다 위에서","author":"Chang-rae Lee","publisher":"Riverhead Books"},{"title":"Pachinko","ko":"파친코","author":"Min Jin Lee","publisher":"Grand Central Publishing"},{"title":"Permanent Record","ko":"","author":"Mary H.K. Choi","publisher":"Simon & Schuster Books for Young Readers"},{"title":"Re Jane","ko":"","author":"Patricia Park","publisher":"Viking (Penguin)"},{"title":"Selected Stories of Anton Chekhov","ko":"안톤 체호프 단편집","author":"잘해","publisher":"Bantam Classics"},{"title":"Severance","ko":"단절","author":"Ling Ma","publisher":"Farrar, Straus and Giroux"},{"title":"Shelter","ko":"안전한 나의 집","author":"Jung Yun","publisher":"Picador"},{"title":"Shortcomings","ko":"완벽하지 않아","author":"Adrian Tomine","publisher":"Drawn & Quarterly"},{"title":"Smoke Gets in Your Eyes: And Other Lessons from the Crematory","ko":"잘해봐야 시체가 되겠지만","author":"Caitlin Doughty","publisher":"W. W. Norton & Company"},{"title":"Subtract: The Untapped Science of Less","ko":"빼기의 기술","author":"Leidy Klotz","publisher":"Flatiron Books"},{"title":"Tell the Wolves I'm Home","ko":"","author":"Carol Rifka Brunt","publisher":"The Dial Press (Random House)"},{"title":"The Alchemist","ko":"연금술사","author":"Paulo Coelho","publisher":"HarperOne"},{"title":"The Book of Form and Emptiness","ko":"우주를 듣는 소년","author":"Ruth Ozeki","publisher":"Viking"},{"title":"The Borrower","ko":"","author":"Rebecca Makkai","publisher":"Viking (Penguin)"},{"title":"The Brothers Karamazov","ko":"까라마조프가의 형제들","author":"Fyodor Dostoevsky","publisher":"Farrar, Straus and Giroux"},{"title":"The Circle","ko":"","author":"Dave Eggers","publisher":"Alfred A. Knopf / McSweeney's"},{"title":"The Collected Stories of Lydia Davis","ko":"리디아 데이비스 작품집 불안의 변이","author":"Lydia Davis","publisher":"Farrar, Straus and Giroux"},{"title":"The Curious Incident of the Dog in the Night-Time","ko":"한밤중에 개에게 일어난 의문의 사건","author":"Mark Haddon","publisher":"Doubleday"},{"title":"The Dinner","ko":"더 디너","author":"Herman Koch","publisher":"Hogarth (Crown)"},{"title":"The Elements of Style (3rd edition)","ko":"영어 글쓰기의 기본","author":"William Strunk Jr. & E.B. White","publisher":"Macmillan"},{"title":"The Giving Tree","ko":"아낌없이 주는 나무","author":"Shel Silverstein","publisher":"Harper & Row (HarperCollins)"},{"title":"The Goldfinch","ko":"황금방울새","author":"Donna Tartt","publisher":"Little, Brown and Company"},{"title":"The Great Divorce","ko":"천국과 지옥의 이혼","author":"C.S. Lewis","publisher":"HarperOne"},{"title":"The Joy Luck Club","ko":"조이 럭 클럽","author":"Amy Tan","publisher":"G. P. Putnam's Sons"},{"title":"The Letters of Vincent van Gogh","ko":"고흐의 편지","author":"Vincent van Gogh","publisher":"(판본마다 다름)"},{"title":"The Martian","ko":"마션","author":"Andy Weir","publisher":"Crown"},{"title":"The Midnight Library","ko":"미드나잇 라이브러리","author":"Matt Haig","publisher":"Viking (미국) / Canongate (영국)"},{"title":"The Nickel Boys","ko":"니클의 소년들","author":"Colson Whitehead","publisher":"Doubleday"},{"title":"The Subtle Art of Not Giving a F*ck: A Counterintuitive Approach to Living a Good Life","ko":"신경 끄기의 기술","author":"Mark Manson","publisher":"HarperOne"},{"title":"The Weather Calendar","ko":"","author":"Henry Head&#x20;","publisher":"확인 필요"},{"title":"The Wind-Up Bird Chronicle","ko":"태엽 감는 새 연대기","author":"Haruki Murakami","publisher":"Vintage International"},{"title":"Tomorrow, and Tomorrow, and Tomorrow","ko":"내일 또 내일 또 내일","author":"Gabrielle Zevin","publisher":"Alfred A. Knopf"},{"title":"Trick Mirror: Reflections on Self-Delusion","ko":"트릭미러","author":"Jia Tolentino","publisher":"Random House"},{"title":"Trust Exercise","ko":"신뢰 연습","author":"Susan Choi","publisher":"Henry Holt and Company"},{"title":"Uses for Obsession: A Chef's Memoir","ko":"","author":"Ben Shewry","publisher":"Murdok books"}];const grid=document.querySelector('#grid'),search=document.querySelector('#search'),count=document.querySelector('#count'),empty=document.querySelector('#empty'),modal=document.querySelector('#modal'),mimg=document.querySelector('#modalimg'),mf=document.querySelector('#modalfallback'),minfo=document.querySelector('#modalinfo');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function koreanShopLink(ko){return 'https://search.kyobobook.co.kr/search?keyword='+encodeURIComponent(ko)}
books.forEach((b,i)=>{let el=document.createElement('article');el.className='card';el.dataset.search=[b.title,b.ko,b.author,b.publisher].join(' ').toLowerCase();let buy=b.ko?`<a class="ko-link" href="${koreanShopLink(b.ko)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">한국어판 보기 ↗</a>`:'';
el.innerHTML=`<div class="cover" data-index="${i}"><img alt="${esc(b.title)} cover" loading="lazy"><div class="fallback"><div class="mark">BOOK</div><div class="cover-title">${esc(b.title)}</div><div class="cover-author">${esc(b.author)}</div><div class="cover-note">표지 불러오는 중</div></div></div><div class="info"><h3>${esc(b.title)}</h3>${b.ko?`<p class="ko">${esc(b.ko)}</p>`:''}<p class="author">${esc(b.author)}</p><p class="publisher">${esc(b.publisher)}</p>${buy}</div>`;
el.addEventListener('click',()=>openModal(i));grid.appendChild(el);});
// Google Books API: load covers as cards approach viewport, and preserve source links for the modal.
const coverData=new Array(books.length);const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){loadCover(+entry.target.dataset.index);observer.unobserve(entry.target)}})},{rootMargin:'250px'});
document.querySelectorAll('.cover').forEach(c=>observer.observe(c));
async function loadCover(i){if(coverData[i])return;let b=books[i];try{let q=encodeURIComponent('intitle:'+b.title+(b.author?' inauthor:'+b.author:''));let res=await fetch('https://www.googleapis.com/books/v1/volumes?q='+q+'&maxResults=5');let data=await res.json();let items=data.items||[];let chosen=items.find(x=>x.volumeInfo&&x.volumeInfo.imageLinks&&x.volumeInfo.imageLinks.thumbnail)||items[0];let v=chosen&&chosen.volumeInfo;let cover=v&&v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);coverData[i]={cover:cover?cover.replace('http:','https:').replace('&zoom=1','&zoom=2'):null,source:v&&v.infoLink||null};let el=document.querySelector(`.cover[data-index="${i}"]`);if(coverData[i].cover){let im=el.querySelector('img');im.src=coverData[i].cover;im.onload=()=>el.classList.add('loaded');im.onerror=()=>{coverData[i].cover=null;};el.querySelector('.cover-note').textContent='표지';}else{el.querySelector('.cover-note').textContent='표지 검색 결과 없음';}}catch(e){coverData[i]={cover:null,source:null};}}
function openModal(i){loadCover(i).then(()=>{let b=books[i],d=coverData[i]||{}, buy=b.ko?`<a class="modalbuy" href="${koreanShopLink(b.ko)}" target="_blank" rel="noopener">한국어판 보기 ↗</a>`:'';const sourceImg=b.sourceImage||null;const sourceUrl=b.sourceUrl||d.source||null;mimg.src=sourceImg||'';mimg.classList.toggle('show',!!sourceImg);mf.style.display=sourceImg?'none':'block';minfo.innerHTML=`<h2>${esc(b.title)}</h2>${b.ko?`<p><strong>한국어 제목:</strong> ${esc(b.ko)}</p>`:''}<p><strong>저자:</strong> ${esc(b.author)}</p><p><strong>출판사:</strong> ${esc(b.publisher)}</p>${buy}<p class="note"><strong>출처 이미지:</strong> 표지와 별도 이미지 영역입니다. 아직 별도 출처 이미지는 등록되지 않은 경우 링크로 출처 자료를 확인하세요.</p>${sourceImg?`<a class="source" href="${esc(sourceImg)}" target="_blank" rel="noopener">출처 이미지 원본 보기 ↗</a>`:''}${sourceUrl?`<a class="source" href="${esc(sourceUrl)}" target="_blank" rel="noopener">책 정보·이미지 출처 페이지 ↗</a>`:'<p class="note">출처 페이지 링크를 찾지 못했어요.</p>'}<a class="source" href="https://www.google.com/search?q=${encodeURIComponent(b.title+' '+b.author+' article')}" target="_blank" rel="noopener">관련 기사 검색 ↗</a><p class="note">카드의 표지 이미지는 Google Books에서 별도로 가져옵니다. 팝업에는 표지 대신 sourceImage가 표시됩니다.</p>`;modal.classList.add('open');});}
function closeModal(){modal.classList.remove('open')}document.querySelector('#close').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});search.addEventListener('input',()=>{let q=search.value.toLowerCase(),n=0;document.querySelectorAll('.card').forEach(c=>{let ok=c.dataset.search.includes(q);c.style.display=ok?'':'none';if(ok)n++});count.textContent=n+' books';empty.style.display=n?'none':'block'});
</script></body></html>
